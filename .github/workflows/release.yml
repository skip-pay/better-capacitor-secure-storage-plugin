name: Release

# npm trusted publishing: the trusted publisher on npmjs.com must name this
# file exactly (release.yml, case-sensitive) and allow `npm publish`, not
# only staging. It needs a GitHub-hosted runner, npm >= 11.5.1,
# Node >= 22.14.0 and id-token: write. The job uses no npm token.
# https://docs.npmjs.com/trusted-publishers

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      # no dependency cache in the publishing job
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm --version
      - run: npm ci
      - name: Check that the tag matches package.json
        run: |
          TAG=$(git describe --tags --exact-match)
          EXPECTED="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "::error::Tag $TAG does not match package.json version ($EXPECTED). Bump the version in package.json or retag."
            exit 1
          fi
      - run: npm publish --provenance --access public

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub release from the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          awk -v v="$VERSION" '
            /^## / { if (found) exit; h = $2; sub(/^v/, "", h); if (h == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file release-notes.md
          else
            echo "::warning::No CHANGELOG section for $VERSION, using generated notes"
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi
